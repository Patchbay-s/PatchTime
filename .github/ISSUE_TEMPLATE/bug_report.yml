name: Bug report
description: Report a reproducible problem in PatchTime
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include personal records, employer details, screenshots of real data, or account credentials."
  - type: input
    id: version
    attributes:
      label: App version and build
      placeholder: "5.0 (1)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fictional data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
