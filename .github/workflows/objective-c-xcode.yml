name: Xcode build and analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and analyze
        run: >-
          xcodebuild
          -project PatchTime.xcodeproj
          -scheme PatchTime
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build analyze
